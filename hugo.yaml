baseURL: https://project-koku.github.io/
languageCode: en-us
title: Project Koku

module:
  imports:
    - path: github.com/imfing/hextra

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: false

outputs:
  home:
    - HTML
    - RSS

defaultContentLanguage: en

languages:
  en:
    languageName: English
    weight: 1
    title: Project Koku

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: About
      pageRef: /about
      weight: 3
    - name: Theme
      weight: 4
      params:
        type: theme-toggle
    - name: GitHub
      weight: 5
      url: "https://github.com/project-koku"
      params:
        icon: github

params:
  description: Open source cost management for clouds, containers, and hybrid environments

  navbar:
    displayTitle: true
    displayLogo: false
    displayThemeToggle: true

  page:
    width: full

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/project-koku/project-koku.github.io/edit/main"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
